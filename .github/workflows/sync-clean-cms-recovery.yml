name: sync-clean-cms-recovery

on:
  push:
    branches:
      - recovery/field-extraction-clean

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[geometry-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Fetch reviewed recovery source
        shell: bash
        run: |
          set -euo pipefail
          git remote remove recovery-source 2>/dev/null || true
          git remote add recovery-source https://github.com/aratij1/cdp.git
          git fetch --no-tags --depth=1 recovery-source recovery/field-extraction-14bb038
          SOURCE_SHA="$(git rev-parse FETCH_HEAD)"
          test "$SOURCE_SHA" = "deb495f661a0621cf12a32ece79f0898230415a0"
          git checkout "$SOURCE_SHA" -- \
            workers/standard_form_extraction/consumer.py \
            workers/standard_form_extraction/extractor.py \
            workers/standard_form_extraction/recovery_eligibility.py \
            workers/page_detection/text_extraction.py \
            packages/templates/cms1500_boxes.py \
            packages/templates/cms1500_local_alignment.py \
            packages/domain/extraction.py \
            packages/evidence_decision/adapters.py \
            packages/ocr/provenance.py \
            packages/canonical_field_outcomes.py \
            evaluation/cms_route_diagnostics.py \
            evaluation/engineering_stage_trace.py \
            tests/unit/cases/test_cms1500_template_first.py \
            tests/unit/cases/test_cms1500_bounded_crops.py \
            tests/unit/cases/test_recovery_eligibility_clean.py \
            tests/unit/cases/test_cms_route_diagnostics.py \
            tests/unit/cases/test_engineering_stage_trace.py

      - name: Apply clean geometry and evidence fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Expose the complete source-independent safe search cells.
          boxes_path = Path("packages/templates/cms1500_boxes.py")
          boxes = boxes_path.read_text(encoding="utf-8")
          if "def safe_regions(" not in boxes:
              marker = "\ndef ocr_regions(template: Template) -> dict[str, tuple[FieldRegion, ...]]:\n"
              safe_fn = '''\ndef safe_regions(template: Template) -> dict[str, tuple[FieldRegion, ...]]:\n    \"\"\"Return the complete label-free public search cells.\n\n    Unlike :func:`ocr_regions`, these regions are not merely a few pixels\n    larger than the canonical value box. They are the source-independent\n    boundaries from ``SAFE_INTERIORS`` and are used only for bounded local\n    alignment. Fields without a larger public interior remain canonical.\n    \"\"\"\n    base = regions(template)\n    width = template.reference_dimensions.width_px\n    height = template.reference_dimensions.height_px\n    result = dict(base)\n    for name, boundaries in SAFE_INTERIORS.items():\n        parts = []\n        for region, boundary in zip(base[name], boundaries, strict=True):\n            parts.append(region.model_copy(update={\n                \"x0\": round(boundary[0] * width),\n                \"y0\": round(boundary[1] * height),\n                \"x1\": round(boundary[2] * width),\n                \"y1\": round(boundary[3] * height),\n            }))\n        result[name] = tuple(parts)\n    return result\n\n'''
              if marker not in boxes:
                  raise SystemExit("ocr_regions anchor missing")
              boxes = boxes.replace(marker, safe_fn + marker, 1)
              boxes_path.write_text(boxes, encoding="utf-8")

          # 2) Replace the experimental aligner with a field-aware bounded version.
          Path("packages/templates/cms1500_local_alignment.py").write_text('''\"\"\"Source-only local alignment inside public CMS-1500 safe cells.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Any\n\nimport cv2\nimport numpy as np\n\nALIGNMENT_VERSION = \"cms1500-local-alignment-v2\"\n\n_SUPPORTED_FIELDS = {\n    \"patient_name\",\n    \"patient_dob\",\n    \"insured_id_number\",\n    \"principal_diagnosis\",\n    \"provider_npi\",\n    \"federal_tax_no\",\n    \"total_charge\",\n}\n_NUMERIC_FIELDS = {\"patient_dob\", \"provider_npi\", \"federal_tax_no\", \"total_charge\"}\n\n\n@dataclass(frozen=True)\nclass LocalAlignmentResult:\n    refined_bbox: tuple[int, int, int, int]\n    status: str\n    score: float\n    x_offset: int\n    y_offset: int\n    width_change: int\n    height_change: int\n    reason_codes: tuple[str, ...] = ()\n\n\ndef _xy(box: Any) -> tuple[int, int, int, int]:\n    if hasattr(box, \"x0\"):\n        return tuple(round(getattr(box, key)) for key in (\"x0\", \"y0\", \"x1\", \"y1\"))\n    if isinstance(box, dict):\n        return tuple(round(box[key]) for key in (\"x0\", \"y0\", \"x1\", \"y1\"))\n    return tuple(round(value) for value in box)\n\n\ndef refine_value_region(\n    image: Any,\n    field_name: str,\n    canonical_bbox: Any,\n    safe_cell_bbox: Any,\n) -> LocalAlignmentResult:\n    \"\"\"Return a bounded text-ink envelope without using labels or truth.\n\n    The canonical box is the expected value location. ``safe_cell_bbox`` is a\n    larger public-form interior that is guaranteed not to cross into a\n    neighbouring semantic cell. The routine may move outside the canonical\n    box, but never outside that safe cell.\n    \"\"\"\n    canonical = _xy(canonical_bbox)\n    safe = _xy(safe_cell_bbox)\n    if field_name not in _SUPPORTED_FIELDS:\n        return LocalAlignmentResult(\n            canonical, \"REFINEMENT_REJECTED\", 0.0, 0, 0, 0, 0, (\"FIELD_NOT_SUPPORTED\",)\n        )\n\n    sx0, sy0, sx1, sy1 = safe\n    cx0, cy0, cx1, cy1 = canonical\n    if not (sx0 <= cx0 < cx1 <= sx1 and sy0 <= cy0 < cy1 <= sy1):\n        return LocalAlignmentResult(\n            canonical, \"REFINEMENT_REJECTED\", 0.0, 0, 0, 0, 0, (\"CANONICAL_OUTSIDE_SAFE_CELL\",)\n        )\n\n    gray = np.asarray(image.convert(\"L\") if hasattr(image, \"convert\") else image)\n    height, width = gray.shape[:2]\n    sx0, sy0 = max(0, sx0), max(0, sy0)\n    sx1, sy1 = min(width, sx1), min(height, sy1)\n    if sx1 <= sx0 or sy1 <= sy0:\n        return LocalAlignmentResult(\n            canonical, \"REFINEMENT_REJECTED\", 0.0, 0, 0, 0, 0, (\"INVALID_SAFE_BOUNDS\",)\n        )\n\n    crop = gray[sy0:sy1, sx0:sx1]\n    if crop.size == 0:\n        return LocalAlignmentResult(canonical, \"NO_INK\", 0.0, 0, 0, 0, 0, (\"EMPTY_REGION\",))\n\n    ink = cv2.threshold(crop, 0, 255, cv2.THRESH_BINARY_INV + cv2.THRESH_OTSU)[1]\n    h_kernel = cv2.getStructuringElement(\n        cv2.MORPH_RECT, (max(8, crop.shape[1] // 3), 1)\n    )\n    v_kernel = cv2.getStructuringElement(\n        cv2.MORPH_RECT, (1, max(8, crop.shape[0] // 2))\n    )\n    rules = cv2.bitwise_or(\n        cv2.morphologyEx(ink, cv2.MORPH_OPEN, h_kernel),\n        cv2.morphologyEx(ink, cv2.MORPH_OPEN, v_kernel),\n    )\n    text_mask = cv2.bitwise_and(ink, cv2.bitwise_not(rules))\n\n    count, _labels, stats, _centroids = cv2.connectedComponentsWithStats(text_mask, 8)\n    components: list[tuple[int, int, int, int, int]] = []\n    max_component_height = max(3, int(crop.shape[0] * 0.90))\n    for index in range(1, count):\n        x, y, w, h, area = (int(value) for value in stats[index])\n        if area < 2 or w < 1 or h < 2 or h > max_component_height:\n            continue\n        if w >= int(crop.shape[1] * 0.95):\n            continue\n        components.append((x, y, w, h, area))\n\n    min_components = 1 if field_name in _NUMERIC_FIELDS else 2\n    if len(components) < min_components:\n        return LocalAlignmentResult(\n            canonical, \"NO_INK\", 0.0, 0, 0, 0, 0, (\"INSUFFICIENT_TEXT_COMPONENTS\",)\n        )\n\n    x0 = min(item[0] for item in components)\n    y0 = min(item[1] for item in components)\n    x1 = max(item[0] + item[2] for item in components)\n    y1 = max(item[1] + item[3] for item in components)\n    total_area = sum(item[4] for item in components)\n\n    rx0 = max(sx0, sx0 + x0 - 2)\n    ry0 = max(sy0, sy0 + y0 - 2)\n    rx1 = min(sx1, sx0 + x1 + 2)\n    ry1 = min(sy1, sy0 + y1 + 2)\n    refined = (rx0, ry0, rx1, ry1)\n\n    refined_area = max(1, (rx1 - rx0) * (ry1 - ry0))\n    density = min(1.0, total_area / refined_area)\n    component_score = min(1.0, len(components) / (3.0 if field_name in _NUMERIC_FIELDS else 5.0))\n    density_score = min(1.0, density / 0.25)\n    score = 0.55 * component_score + 0.45 * density_score\n    if score < 0.15:\n        return LocalAlignmentResult(\n            canonical, \"AMBIGUOUS\", score, 0, 0, 0, 0, (\"LOW_ALIGNMENT_SCORE\",)\n        )\n\n    max_shift = 10 if field_name in _NUMERIC_FIELDS else 14\n    edge_shifts = (abs(rx0 - cx0), abs(ry0 - cy0), abs(rx1 - cx1), abs(ry1 - cy1))\n    if max(edge_shifts) > max_shift:\n        return LocalAlignmentResult(\n            canonical, \"REFINEMENT_REJECTED\", score, 0, 0, 0, 0, (\"OFFSET_LIMIT\",)\n        )\n\n    if refined == canonical:\n        return LocalAlignmentResult(\n            refined, \"CANONICAL_ACCEPTED\", score, 0, 0, 0, 0, (\"INK_ENVELOPE_MATCH\",)\n        )\n\n    return LocalAlignmentResult(\n        refined,\n        \"REFINED\",\n        score,\n        rx0 - cx0,\n        ry0 - cy0,\n        (rx1 - rx0) - (cx1 - cx0),\n        (ry1 - ry0) - (cy1 - cy0),\n        (\"TEXT_INK_ENVELOPE\",),\n    )\n\n\n__all__ = [\"ALIGNMENT_VERSION\", \"LocalAlignmentResult\", \"refine_value_region\"]\n''', encoding="utf-8")

          # 3) Add explicit deterministic selection helpers to extractor.py.
          extractor_path = Path("workers/standard_form_extraction/extractor.py")
          extractor = extractor_path.read_text(encoding="utf-8")
          helper_anchor = "\ndef _make_field(\n"
          helpers = '''\ndef _select_cms_attempt(\n    canonical_suspicious: bool,\n    refined_suspicious: bool | None,\n    recovery_suspicious: bool | None,\n) -> str | None:\n    \"\"\"Select one attempt using suspicion state only.\n\n    ``True`` means the candidate still needs recovery. A clean canonical read\n    always wins. A clean refined read may replace only a suspicious canonical\n    read, and bounded recovery is considered only if both earlier attempts are\n    absent or suspicious.\n    \"\"\"\n    if not canonical_suspicious:\n        return \"canonical\"\n    if refined_suspicious is False:\n        return \"refined\"\n    if recovery_suspicious is False:\n        return \"recovery\"\n    return None\n\n\ndef _mark_selected_evidence(field: ExtractedField, selected: FieldEvidence | None) -> None:\n    \"\"\"Persist selection both in-memory and inside candidate JSON metadata.\"\"\"\n    field.selected_evidence_id = selected.evidence_id if selected is not None else None\n    for candidate in field.candidates:\n        metadata = dict(candidate.adjudication_metadata or {})\n        metadata[\"selected\"] = bool(\n            selected is not None and candidate.evidence_id == selected.evidence_id\n        )\n        candidate.adjudication_metadata = metadata\n\n'''
          if "def _select_cms_attempt(" not in extractor:
              if helper_anchor not in extractor:
                  raise SystemExit("extractor helper anchor missing")
              extractor = extractor.replace(helper_anchor, helpers + helper_anchor, 1)

          # Make dynamic extraction persist the explicit winning candidate too.
          old_dynamic = '''            if recovery_selected:\n                selected = next((c for c in field.candidates if c.source == ExtractionMethod.ALTERNATE_PREPROCESS_OCR), None)\n                field.selected_evidence_id = selected.evidence_id if selected is not None else None\n            elif primary_raw and field.candidates:\n                selected = next((c for c in field.candidates if c.source == ExtractionMethod.REGIONAL_RAPIDOCR), None)\n                field.selected_evidence_id = selected.evidence_id if selected is not None else None\n'''
          new_dynamic = '''            selected_evidence = None\n            if recovery_selected:\n                selected_evidence = next(\n                    (c for c in field.candidates if c.source == ExtractionMethod.ALTERNATE_PREPROCESS_OCR),\n                    None,\n                )\n            elif primary_raw and field.candidates:\n                selected_evidence = next(\n                    (c for c in field.candidates if c.source == ExtractionMethod.REGIONAL_RAPIDOCR),\n                    None,\n                )\n            _mark_selected_evidence(field, selected_evidence)\n'''
          if old_dynamic not in extractor:
              raise SystemExit("dynamic selected-evidence anchor missing")
          extractor = extractor.replace(old_dynamic, new_dynamic, 1)

          start = extractor.index("    def extract_cms1500_fields(")
          end = extractor.index("    def extract_fields_from_resolved_rois(", start)
          cms_method = '''    def extract_cms1500_fields(self, image, template, page_number, geometry):\n        \"\"\"Extract verified CMS-1500 fields with bounded geometry recovery.\n\n        Runtime localization is source-only: canonical NUCC geometry, public\n        safe cells and image morphology. Truth and reviewer coordinates are\n        never available to this path.\n        \"\"\"\n        from packages.templates.cms1500_boxes import (\n            BOXES,\n            GEOMETRY_VERSION,\n            ocr_regions,\n            regions,\n            safe_regions,\n        )\n        from packages.templates.cms1500_local_alignment import (\n            ALIGNMENT_VERSION,\n            refine_value_region,\n        )\n        from workers.standard_form_extraction.recovery_eligibility import assess_recovery\n\n        if template.template_id != \"cms1500\" or not geometry.authorizes_fixed_roi:\n            raise ValueError(\"CMS_VALUE_BOXES_REQUIRE_VERIFIED_REGISTERED_GEOMETRY\")\n\n        fields: list[ExtractedField] = []\n        requests = 0\n        canonical_parts = regions(template)\n        bounded_parts = ocr_regions(template)\n        safe_parts = safe_regions(template)\n\n        for name, parts in bounded_parts.items():\n            evidence: list[FieldEvidence] = []\n            display_parts: list[FieldEvidence] = []\n            selected_parts: list[FieldEvidence | None] = []\n            readings: list[tuple[str, float, int, FieldEvidence | None]] = []\n            unresolved_reasons: set[str] = set()\n\n            for index, bounded in enumerate(parts):\n                original = canonical_parts[name][index]\n                safe = safe_parts[name][index]\n                single_line = name not in {\"provider_name\", \"patient_address\", \"insured_address\"}\n                recognize = (\n                    getattr(self._text_extractor, \"extract_line\", self._text_extractor.extract_region)\n                    if single_line\n                    else self._text_extractor.extract_region\n                )\n\n                def read_region(\n                    region,\n                    variant,\n                    *,\n                    metadata=None,\n                    field_name=name,\n                    region_reader=recognize,\n                    canonical_region=original,\n                    is_single_line=single_line,\n                    region_index=index,\n                ):\n                    if hasattr(self._text_extractor, \"set_context\"):\n                        self._text_extractor.set_context(field=field_name, reason=variant)\n                    lines = line_clustered_reading_order(\n                        region_reader(image, region.x0, region.y0, region.x1, region.y1)\n                    )\n                    text = \" \".join(line.text for line in lines)\n                    confidence = (\n                        sum(line.confidence for line in lines) / len(lines) if lines else 0.0\n                    )\n                    bbox = BoundingBox(\n                        x0=region.x0, y0=region.y0, x1=region.x1, y1=region.y1,\n                        image_width=image.width, image_height=image.height,\n                    )\n                    canonical_bbox = BoundingBox(\n                        x0=canonical_region.x0,\n                        y0=canonical_region.y0,\n                        x1=canonical_region.x1,\n                        y1=canonical_region.y1,\n                        image_width=image.width,\n                        image_height=image.height,\n                    )\n                    method = (\n                        ExtractionMethod.REGIONAL_RAPIDOCR\n                        if getattr(self._text_extractor, \"engine_name\", \"\") == \"rapidocr\"\n                        else ExtractionMethod.REGIONAL_PADDLEOCR\n                    )\n                    return FieldEvidence(\n                        source=method,\n                        raw_text=text,\n                        confidence=confidence,\n                        bounding_box=bbox,\n                        tokens=tuple(\n                            {\n                                \"text\": line.text,\n                                \"confidence\": line.confidence,\n                                \"bounding_box\": BoundingBox(\n                                    x0=line.x0, y0=line.y0, x1=line.x1, y1=line.y1,\n                                    image_width=image.width, image_height=image.height,\n                                ).model_dump(mode=\"json\"),\n                            }\n                            for line in lines\n                        ),\n                        model_name=getattr(self._text_extractor, \"model_name\", None),\n                        model_version=getattr(self._text_extractor, \"model_version\", None),\n                        adjudication_metadata=metadata,\n                        provenance=EvidenceProvenance(\n                            bbox=bbox,\n                            canonical_bbox=canonical_bbox,\n                            ocr_crop_bbox=bbox,\n                            canonical_crop_sha256=_crop_sha256(\n                                image,\n                                (\n                                    canonical_region.x0,\n                                    canonical_region.y0,\n                                    canonical_region.x1,\n                                    canonical_region.y1,\n                                ),\n                            ),\n                            crop_coordinate_space=\"REGISTERED_CANONICAL\",\n                            crop_sha256=_crop_sha256(\n                                image, (region.x0, region.y0, region.x1, region.y1)\n                            ),\n                            localization_method=\"REGISTERED_CMS1500_VALUE_BOX\",\n                            preprocessing_profile=(\n                                \"VERIFIED_SINGLE_LINE_VALUE\"\n                                if is_single_line\n                                else \"VERIFIED_MULTILINE_VALUE\"\n                            ),\n                            preprocessing_version=variant,\n                            localization_version=GEOMETRY_VERSION,\n                            localization_region_id=(\n                                f\"{BOXES[field_name][0]}:{region_index + 1}\"\n                            ),\n                            engine_name=getattr(self._text_extractor, \"engine_name\", None),\n                            normalization_version=\"field-normalization-existing\",\n                        ),\n                    )\n\n                canonical_region = original if single_line else bounded\n                canonical = read_region(\n                    canonical_region,\n                    \"CANONICAL_PRIMARY\" if single_line else \"BOUNDED_MULTILINE_PRIMARY\",\n                )\n                requests += 1\n                attempts = [canonical]\n                canonical_suspicious = assess_recovery(\n                    name, parts[0].field_type, canonical\n                ).eligible\n\n                refined = None\n                refined_suspicious = None\n                recovery = None\n                recovery_suspicious = None\n\n                if single_line and canonical_suspicious:\n                    alignment = refine_value_region(image, name, original, safe)\n                    if alignment.status == \"REFINED\":\n                        refined_region = original.model_copy(update={\n                            \"x0\": alignment.refined_bbox[0],\n                            \"y0\": alignment.refined_bbox[1],\n                            \"x1\": alignment.refined_bbox[2],\n                            \"y1\": alignment.refined_bbox[3],\n                        })\n                        refined = read_region(\n                            refined_region,\n                            \"LOCAL_REFINED_VALUE\",\n                            metadata={\n                                \"local_alignment\": {\n                                    \"version\": ALIGNMENT_VERSION,\n                                    \"status\": alignment.status,\n                                    \"score\": alignment.score,\n                                    \"safe_search_bbox\": {\n                                        \"x0\": safe.x0, \"y0\": safe.y0,\n                                        \"x1\": safe.x1, \"y1\": safe.y1,\n                                    },\n                                    \"refined_bbox\": {\n                                        \"x0\": alignment.refined_bbox[0],\n                                        \"y0\": alignment.refined_bbox[1],\n                                        \"x1\": alignment.refined_bbox[2],\n                                        \"y1\": alignment.refined_bbox[3],\n                                    },\n                                    \"x_offset\": alignment.x_offset,\n                                    \"y_offset\": alignment.y_offset,\n                                    \"width_change\": alignment.width_change,\n                                    \"height_change\": alignment.height_change,\n                                    \"reason_codes\": list(alignment.reason_codes),\n                                }\n                            },\n                        )\n                        requests += 1\n                        attempts.append(refined)\n                        refined_suspicious = assess_recovery(\n                            name, parts[0].field_type, refined\n                        ).eligible\n\n                    provisional = _select_cms_attempt(\n                        canonical_suspicious, refined_suspicious, None\n                    )\n                    if provisional is None and original != bounded:\n                        recovery = read_region(bounded, \"BOUNDED_VALUE_RECOVERY\")\n                        requests += 1\n                        attempts.append(recovery)\n                        recovery_suspicious = assess_recovery(\n                            name, parts[0].field_type, recovery\n                        ).eligible\n\n                choice = _select_cms_attempt(\n                    canonical_suspicious, refined_suspicious, recovery_suspicious\n                )\n                selected = {\n                    \"canonical\": canonical,\n                    \"refined\": refined,\n                    \"recovery\": recovery,\n                }.get(choice)\n\n                row_empty = not any(item.raw_text.strip() for item in attempts)\n                if canonical_suspicious and selected is None and not (\n                    name == \"provider_npi\" and row_empty\n                ):\n                    unresolved_reasons.add(\"RECOVERY_UNRESOLVED\")\n                    if any(not item.raw_text.strip() for item in attempts):\n                        unresolved_reasons.add(\"RECOVERY_BLANK\")\n                    else:\n                        unresolved_reasons.add(\"RECOVERY_ALL_SUSPICIOUS\")\n\n                display = selected or canonical\n                evidence.extend(attempts)\n                display_parts.append(display)\n                selected_parts.append(selected)\n                if display.raw_text.strip():\n                    readings.append((display.raw_text, display.confidence, index, selected))\n\n            ambiguous = False\n            invalid_observed_npi = False\n            selected_field_evidence = None\n            selected_index = 0\n\n            if name == \"provider_npi\":\n                from packages.validation_rules.npi import is_valid_npi\n\n                def npi_value(text):\n                    value, ok = normalize(\"npi\", text)\n                    return value if ok else None\n\n                valid_rows = [\n                    row for row in readings\n                    if npi_value(row[0]) is not None and is_valid_npi(npi_value(row[0]))\n                ]\n                valid_values = {npi_value(row[0]) for row in valid_rows}\n                if len(valid_values) > 1:\n                    raw, confidence, selected_index = \"\", 0.0, 0\n                    ambiguous = True\n                elif len(valid_values) == 1:\n                    value = next(iter(valid_values))\n                    chosen = next(row for row in valid_rows if npi_value(row[0]) == value)\n                    raw, confidence, selected_index, selected_field_evidence = chosen\n                else:\n                    observed = list(dict.fromkeys(row[0].strip() for row in readings if row[0].strip()))\n                    if len(observed) == 1:\n                        chosen = next(row for row in readings if row[0].strip() == observed[0])\n                        raw, confidence, selected_index, _selected = chosen\n                        selected_field_evidence = None\n                        invalid_observed_npi = True\n                    elif observed:\n                        raw, confidence, selected_index = \"\", 0.0, 0\n                        ambiguous = True\n                    else:\n                        raw, confidence, selected_index = \"\", 0.0, 0\n            else:\n                raw = \" \".join(row[0] for row in readings)\n                confidence = min((row[1] for row in readings), default=0.0)\n                if len(parts) == 1 and selected_parts and not unresolved_reasons:\n                    selected_field_evidence = selected_parts[0]\n\n            fallback_box = (\n                parts[selected_index]\n                if name == \"provider_npi\"\n                else template.field_region(name)\n            )\n            selected_box = (\n                selected_field_evidence.bounding_box\n                if selected_field_evidence is not None and selected_field_evidence.bounding_box is not None\n                else fallback_box\n            )\n            method = (\n                selected_field_evidence.source\n                if selected_field_evidence is not None\n                else (evidence[0].source if evidence else ExtractionMethod.REGIONAL_RAPIDOCR)\n            )\n            field = _make_field(\n                template, name, parts[0].field_type, raw, confidence,\n                selected_box.x0, selected_box.y0, selected_box.x1, selected_box.y1,\n                page_number, image.width, image.height, method,\n            )\n\n            if len(parts) > 1 and name != \"provider_npi\":\n                combined = FieldEvidence(\n                    source=method,\n                    raw_text=raw,\n                    confidence=confidence,\n                    bounding_box=field.bounding_box,\n                    model_name=getattr(self._text_extractor, \"model_name\", None),\n                    model_version=getattr(self._text_extractor, \"model_version\", None),\n                    tokens=tuple(token for item in display_parts for token in item.tokens),\n                    provenance=EvidenceProvenance(\n                        bbox=field.bounding_box,\n                        crop_sha256=_crop_sha256(\n                            image,\n                            (\n                                field.bounding_box.x0, field.bounding_box.y0,\n                                field.bounding_box.x1, field.bounding_box.y1,\n                            ),\n                        ),\n                        localization_method=\"REGISTERED_CMS1500_VALUE_STRIPS\",\n                        localization_version=GEOMETRY_VERSION,\n                        localization_region_id=BOXES[name][0],\n                        engine_name=getattr(self._text_extractor, \"engine_name\", None),\n                        upstream_candidate_ids=tuple(\n                            str(item.evidence_id) for item in display_parts\n                        ),\n                    ),\n                )\n                evidence.insert(0, combined)\n                if not unresolved_reasons:\n                    selected_field_evidence = combined\n\n            field.candidates = evidence\n            field.model_name = getattr(self._text_extractor, \"model_name\", None)\n            field.model_version = getattr(self._text_extractor, \"model_version\", None)\n\n            if unresolved_reasons:\n                field.validation_status = ValidationStatus.NEEDS_REVIEW\n                field.validation_reasons.extend(sorted(unresolved_reasons))\n                selected_field_evidence = None\n            if invalid_observed_npi:\n                field.validation_status = ValidationStatus.NEEDS_REVIEW\n                field.validation_reasons.append(\"NPI_OBSERVED_INVALID_REVIEW\")\n                selected_field_evidence = None\n            if ambiguous:\n                field.validation_status = ValidationStatus.NEEDS_REVIEW\n                field.validation_reasons.extend(\n                    [\"RENDERING_PROVIDER_ROW_AMBIGUITY\", \"AMBIGUOUS_MULTIROW\"]\n                )\n                selected_field_evidence = None\n\n            _mark_selected_evidence(field, selected_field_evidence)\n            if len({item.evidence_id for item in field.candidates}) != len(field.candidates):\n                raise ValueError(\"DUPLICATE_CMS_EVIDENCE_ID\")\n            fields.append(field)\n\n        self.last_field_ocr_cost = {\n            \"logical_regional_requests\": requests,\n            \"executed_regional_requests\": requests,\n            \"coalesced_requests\": 0,\n            \"request_reduction_rate\": 0.0,\n        }\n        return fields\n\n'''
          extractor = extractor[:start] + cms_method + extractor[end:]
          extractor_path.write_text(extractor, encoding="utf-8")

          # 4) Root-cause taxonomy must contain every emitted value.
          stage_path = Path("evaluation/engineering_stage_trace.py")
          stage = stage_path.read_text(encoding="utf-8")
          start = stage.index("ROOT_CAUSES = (")
          end = stage.index("\n_CAUSE =", start)
          stage = stage[:start] + '''ROOT_CAUSES = (\n    \"FORM_ROUTING\", \"PAGE_REGISTRATION\", \"CROP_GEOMETRY\", \"OCR_RECOGNITION\",\n    \"FIELD_ASSEMBLY\", \"FIELD_MAPPING\", \"NORMALIZATION\", \"FINAL_OUTPUT\",\n    \"LABEL_CONTRACT_ERROR\", \"SOURCE_UNREADABLE\", \"SOURCE_AMBIGUOUS\",\n    \"EVIDENCE_UNVERIFIED\", \"EXECUTION_FAILURE\",\n)\n''' + stage[end:]
          stage_path.write_text(stage, encoding="utf-8")

          # 5) Honest fallback accounting: request != runtime failure.
          diag_path = Path("evaluation/cms_route_diagnostics.py")
          diag = diag_path.read_text(encoding="utf-8")
          old_row = '''            row = {\"identity_verified\": identity, \"registration_accepted\": registration,\n                   \"canonical_entered\": canonical, \"fallback_requested\": bool(fallbacks),\n                   \"fallback_runtime_unavailable\": bool(fallbacks), \"first_failing_stage\": first,\n                   \"fallback_reason_codes\": sorted({r for p in fallbacks for r in p.get(\"reason_codes\", [])})}\n'''
          new_row = '''            fallback_reasons = sorted({\n                reason for payload in fallbacks for reason in payload.get(\"reason_codes\", [])\n            })\n            unavailable_codes = {\n                \"FALLBACK_RUNTIME_NOT_IMPLEMENTED\",\n                \"MODEL_NOT_AVAILABLE\",\n                \"MODEL_NOT_AVAILABLE_ERROR\",\n                \"RUNTIME_DEPENDENCY_PREFLIGHT_FAILED\",\n            }\n            runtime_unavailable = bool(set(fallback_reasons) & unavailable_codes)\n            fallback_requested = bool(fallbacks)\n            fallback_completed = fallback_requested and bool(completed) and not runtime_unavailable\n            fallback_review_hold = fallback_requested and not runtime_unavailable and not fallback_completed\n            row = {\n                \"identity_verified\": identity,\n                \"registration_accepted\": registration,\n                \"canonical_entered\": canonical,\n                \"fallback_requested\": fallback_requested,\n                \"fallback_completed\": fallback_completed,\n                \"fallback_review_hold\": fallback_review_hold,\n                \"fallback_runtime_unavailable\": runtime_unavailable,\n                \"first_failing_stage\": first,\n                \"fallback_reason_codes\": fallback_reasons,\n            }\n'''
          if old_row not in diag:
              raise SystemExit("fallback diagnostic row anchor missing")
          diag_path.write_text(diag.replace(old_row, new_row, 1), encoding="utf-8")

          # 6) Make RECOVERY_UNRESOLVED an unconditional fail-closed disposition signal.
          service_path = Path("packages/evidence_decision/service.py")
          service = service_path.read_text(encoding="utf-8")
          if 'any("RECOVERY_UNRESOLVED" in candidate.validation_results' not in service:
              marker = '''        if not field_policy.configured:\n'''
              insert = '''        if any(\n            \"RECOVERY_UNRESOLVED\" in candidate.validation_results\n            for candidate in context.candidates\n        ):\n            return self._terminal(\n                context,\n                FieldDisposition.HUMAN_REVIEW_REQUIRED,\n                NextAction.HUMAN_REVIEW,\n                [\"RECOVERY_UNRESOLVED\"],\n                bundle=bundle,\n                available=available,\n                missing=missing,\n            )\n'''
              if marker not in service:
                  raise SystemExit("evidence-decision insertion anchor missing")
              service = service.replace(marker, insert + marker, 1)
              service_path.write_text(service, encoding="utf-8")

          # 7) Preserve selected identity across DB persistence through candidate metadata.
          adapter_path = Path("packages/evidence_decision/adapters.py")
          adapter = adapter_path.read_text(encoding="utf-8")
          old = '''    selected_id = str(field.selected_evidence_id) if field.selected_evidence_id else None\n    candidates = [\n'''
          new = '''    selected_id = str(field.selected_evidence_id) if field.selected_evidence_id else None\n    if selected_id is None:\n        metadata_selected = [\n            item for item in evidence\n            if (item.adjudication_metadata or {}).get(\"selected\") is True\n        ]\n        if len(metadata_selected) == 1:\n            selected_id = str(metadata_selected[0].evidence_id)\n    candidates = [\n'''
          if old not in adapter:
              raise SystemExit("adapter selected-id anchor missing")
          adapter_path.write_text(adapter.replace(old, new, 1), encoding="utf-8")

          # 8) Tests: taxonomy membership and geometry truth table/source-only alignment.
          test_stage = Path("tests/unit/cases/test_engineering_stage_trace.py")
          stage_tests = test_stage.read_text(encoding="utf-8")
          stage_tests = stage_tests.replace(\
              "from evaluation.engineering_stage_trace import STAGES, first_failure",\
              "from evaluation.engineering_stage_trace import ROOT_CAUSES, STAGES, first_failure",\
              1,\
          )
          if "test_every_emitted_root_cause_is_declared" not in stage_tests:
              stage_tests += '''\n\ndef test_every_emitted_root_cause_is_declared():\n    for stage in STAGES:\n        values = dict.fromkeys(STAGES, True)\n        values[stage] = False\n        result = first_failure(values)\n        assert result[\"root_cause\"] is None or result[\"root_cause\"] in ROOT_CAUSES\n    values = dict.fromkeys(STAGES, True)\n    values[STAGES[0]] = None\n    assert first_failure(values)[\"root_cause\"] in ROOT_CAUSES\n'''
          test_stage.write_text(stage_tests, encoding="utf-8")

          Path("tests/unit/cases/test_cms1500_local_alignment.py").write_text('''from PIL import Image, ImageDraw\n\nfrom packages.templates.cms1500_local_alignment import refine_value_region\nfrom workers.standard_form_extraction.extractor import _select_cms_attempt\n\n\ndef _glyph_image(boxes):\n    image = Image.new(\"L\", (220, 100), 255)\n    draw = ImageDraw.Draw(image)\n    for box in boxes:\n        draw.rectangle(box, fill=0)\n    return image\n\n\ndef test_selection_truth_table():\n    assert _select_cms_attempt(False, None, None) == \"canonical\"\n    assert _select_cms_attempt(False, False, False) == \"canonical\"\n    assert _select_cms_attempt(True, False, None) == \"refined\"\n    assert _select_cms_attempt(True, True, False) == \"recovery\"\n    assert _select_cms_attempt(True, None, False) == \"recovery\"\n    assert _select_cms_attempt(True, True, True) is None\n    assert _select_cms_attempt(True, None, True) is None\n\n\ndef test_local_alignment_can_recover_left_shift_inside_safe_cell():\n    canonical = (60, 25, 130, 55)\n    safe = (50, 15, 140, 65)\n    image = _glyph_image([(54, 30, 58, 43), (62, 30, 66, 43), (70, 30, 74, 43)])\n    result = refine_value_region(image, \"patient_name\", canonical, safe)\n    assert result.status == \"REFINED\"\n    assert safe[0] <= result.refined_bbox[0] < canonical[0]\n    assert result.refined_bbox[2] <= safe[2]\n\n\ndef test_local_alignment_can_recover_right_shift_inside_safe_cell():\n    canonical = (60, 25, 130, 55)\n    safe = (50, 15, 140, 65)\n    image = _glyph_image([(122, 30, 126, 43), (130, 30, 134, 43), (136, 30, 138, 43)])\n    result = refine_value_region(image, \"patient_name\", canonical, safe)\n    assert result.status == \"REFINED\"\n    assert result.refined_bbox[2] > canonical[2]\n    assert result.refined_bbox[2] <= safe[2]\n\n\ndef test_npi_alignment_never_crosses_row_safe_cell():\n    canonical = (90, 30, 150, 48)\n    safe = (86, 27, 154, 51)\n    image = _glyph_image([(88, 32, 91, 43), (96, 32, 99, 43), (105, 32, 108, 43)])\n    # Ink outside the row must not affect the result.\n    draw = ImageDraw.Draw(image)\n    draw.rectangle((155, 20, 180, 60), fill=0)\n    result = refine_value_region(image, \"provider_npi\", canonical, safe)\n    assert result.refined_bbox[0] >= safe[0]\n    assert result.refined_bbox[1] >= safe[1]\n    assert result.refined_bbox[2] <= safe[2]\n    assert result.refined_bbox[3] <= safe[3]\n\n\ndef test_unknown_field_cannot_refine():\n    image = _glyph_image([(55, 30, 58, 43), (62, 30, 66, 43)])\n    result = refine_value_region(image, \"unknown_field\", (60, 25, 130, 55), (50, 15, 140, 65))\n    assert result.status == \"REFINEMENT_REJECTED\"\n''', encoding="utf-8")

          route_test = Path("tests/unit/cases/test_cms_route_diagnostics.py")
          route_test.write_text('''from evaluation.cms_route_diagnostics import diagnose\n\n\ndef _execution(reason_codes, *, completed=False):\n    events = [{\n        \"topic\": \"extraction.unstructured.requested\",\n        \"envelope\": {\"payload\": {\n            \"page_numbers\": [1],\n            \"reason_codes\": reason_codes,\n            \"private_text\": \"do not emit\",\n        }},\n    }]\n    if completed:\n        events.append({\n            \"topic\": \"extraction.completed\",\n            \"envelope\": {\"payload\": {\"page_number\": 1}},\n        })\n    return {\n        \"candidate_commit_sha\": \"candidate\",\n        \"claims\": [{\"pages\": [{\"page_number\": 1}], \"fields\": [], \"events\": events}],\n    }\n\n\ndef test_fallback_request_is_not_runtime_unavailable():\n    result = diagnose(_execution([\"STANDARD_EVIDENCE_INSUFFICIENT\"]))\n    row = result[\"pages\"][0]\n    assert row[\"fallback_requested\"]\n    assert row[\"fallback_review_hold\"]\n    assert not row[\"fallback_completed\"]\n    assert not row[\"fallback_runtime_unavailable\"]\n    assert \"do not emit\" not in str(result)\n\n\ndef test_completed_fallback_is_accounted_separately():\n    result = diagnose(_execution([\"STANDARD_EVIDENCE_INSUFFICIENT\"], completed=True))\n    row = result[\"pages\"][0]\n    assert row[\"fallback_requested\"]\n    assert row[\"fallback_completed\"]\n    assert not row[\"fallback_review_hold\"]\n    assert not row[\"fallback_runtime_unavailable\"]\n\n\ndef test_explicit_runtime_failure_is_unavailable():\n    result = diagnose(_execution([\"FALLBACK_RUNTIME_NOT_IMPLEMENTED\"]))\n    row = result[\"pages\"][0]\n    assert row[\"fallback_runtime_unavailable\"]\n    assert not row[\"fallback_review_hold\"]\n''', encoding="utf-8")
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate clean implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            workers/standard_form_extraction/consumer.py \
            workers/standard_form_extraction/extractor.py \
            workers/standard_form_extraction/recovery_eligibility.py \
            packages/templates/cms1500_boxes.py \
            packages/templates/cms1500_local_alignment.py \
            packages/domain/extraction.py \
            packages/evidence_decision/adapters.py \
            packages/ocr/provenance.py \
            evaluation/cms_route_diagnostics.py \
            evaluation/engineering_stage_trace.py
          python scripts/check_architecture.py
          ruff check \
            workers/standard_form_extraction/consumer.py \
            workers/standard_form_extraction/extractor.py \
            workers/standard_form_extraction/recovery_eligibility.py \
            packages/templates/cms1500_boxes.py \
            packages/templates/cms1500_local_alignment.py \
            packages/domain/extraction.py \
            packages/evidence_decision/adapters.py \
            packages/ocr/provenance.py \
            evaluation/cms_route_diagnostics.py \
            evaluation/engineering_stage_trace.py \
            tests/unit/cases/test_cms1500_local_alignment.py \
            tests/unit/cases/test_cms_route_diagnostics.py
          python -m pytest \
            tests/unit/cases/test_cms1500_local_alignment.py \
            tests/unit/cases/test_cms1500_template_first.py \
            tests/unit/cases/test_cms1500_bounded_crops.py \
            tests/unit/cases/test_recovery_eligibility_clean.py \
            tests/unit/cases/test_engineering_stage_trace.py \
            tests/unit/cases/test_cms_route_diagnostics.py \
            -q -p no:cacheprovider --basetemp="${RUNNER_TEMP}/cms-recovery"
          git diff --check

      - name: Commit clean code to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ashneevai"
          git config user.email "35860118+ashneevai@users.noreply.github.com"
          rm -f .github/workflows/sync-clean-cms-recovery.yml
          git add -A
          git commit -m "[geometry-sync] Clean CMS geometry recovery"
          git push origin HEAD:recovery/field-extraction-clean
