name: quality

on:
  push:
    branches: [main, phase9-external-1000-execution, phase9d-semantic-recovery]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q apps packages workers evaluation scripts tests

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_architecture.py
      # The repository has a pre-existing legacy Ruff backlog. Keep this gate
      # deterministic and enforce the Phase 9C/9D production surface explicitly.
      - run: >-
          ruff check
          evaluation/run_production_holdout_v2.py
          packages/domain/enums.py
          packages/release_freeze.py
          packages/spatial_token_assignment.py
          tests/unit/cases/test_phase9b_single_pass.py
          tests/unit/cases/test_phase9d_spatial_token_assignment.py
          workers/standard_form_extraction/extractor.py
          workers/standard_form_extraction/processing.py

  unit-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest -q -p no:cacheprovider --basetemp=.test-tmp/core
          tests/unit/cases/test_phase8_2_convergence.py
          tests/unit/cases/test_standard_form_extraction.py
          tests/unit/cases/test_evidence_decision_service.py
          tests/unit/cases/test_claim_decision_service.py

  phase9-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest -q -p no:cacheprovider --basetemp=.test-tmp/phase9
          tests/test_external_qualification.py
          tests/unit/cases/test_phase9_remaining_foundations.py
          tests/unit/cases/test_phase9_performance_harness.py
          tests/unit/cases/test_phase9_external_integration_repairs.py
          tests/unit/cases/test_phase9b_single_pass.py
          tests/unit/cases/test_phase9d_spatial_token_assignment.py
          tests/unit/cases/test_ground_truth_workstream.py

  evaluation-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/architecture -q -p no:cacheprovider --basetemp=.test-tmp/safety
      - run: pytest tests/unit/cases/test_table_baseline_protection.py -q -p no:cacheprovider --basetemp=.test-tmp/freeze

  evaluation-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/evaluation_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/evaluation_ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test -- --run
      - run: npm run build
