name: idp-claims-platform

x-app-build: &app-build
  context: .
  dockerfile: deploy/docker/app.Dockerfile

x-ocr-build: &ocr-build
  context: .
  dockerfile: deploy/docker/ocr.Dockerfile

x-routing-build: &routing-build
  context: .
  dockerfile: deploy/docker/routing.Dockerfile

x-handwriting-build: &handwriting-build
  context: .
  dockerfile: deploy/docker/handwriting-ocr.Dockerfile

x-app-env: &app-env
  env_file:
    - .env

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  trusted-claims-mysql:
    profiles: ["trusted-source"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${TRUSTED_CLAIMS_MYSQL_DATABASE:-claims_truth}
      MYSQL_ROOT_PASSWORD: ${TRUSTED_CLAIMS_MYSQL_ROOT_PASSWORD:-change-for-local-development}
      TRUSTED_CLAIMS_MYSQL_READER_PASSWORD: ${TRUSTED_CLAIMS_MYSQL_READER_PASSWORD:-change-for-local-development}
    ports:
      - "3307:3306"
    volumes:
      - trusted_claims_mysql_data:/var/lib/mysql
      - ./deploy/mysql/trusted-claims-init.sql:/docker-entrypoint-initdb.d/01-trusted-claims.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idp_dev_password
      POSTGRES_DB: idp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/trusted-claims-init.sql:/docker-entrypoint-initdb.d/20-trusted-claims.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp -d idp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # host-side only; other containers reach it as redis:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingestion-api:
    build: *app-build
    <<: *app-env
    restart: unless-stopped
    command: ["uvicorn", "apps.ingestion_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  document-preparation-worker:
    build: *app-build
    <<: *app-env
    restart: unless-stopped
    command: ["python", "-m", "workers.document_preparation.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  page-detection-worker:
    build: *routing-build
    <<: *app-env
    logging: *default-logging
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      CORRECTION_MEMORY_PATH: /data/feedback/corrections.jsonl
    volumes:
      - ./evaluation_results/feedback:/data/feedback:ro
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 1024m
          pids: 256
        reservations:
          memory: 256m
    restart: unless-stopped
    command: ["python", "-m", "workers.page_detection.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  standard-form-extraction-worker:
    build: *ocr-build
    <<: *app-env
    logging: *default-logging
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    volumes:
      - paddleocr_runtime_models:/home/appuser/.paddleocr
      - ocr_audit_data:/data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 256
        reservations:
          memory: 512m
    restart: unless-stopped
    command: ["python", "-m", "workers.standard_form_extraction.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  unstructured-extraction-worker:
    build: *ocr-build
    <<: *app-env
    logging: *default-logging
    command: ["python", "-m", "workers.unstructured_extraction.consumer"]
    restart: unless-stopped
    volumes:
      - ocr_audit_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  human-review-api:
    build: *app-build
    <<: *app-env
    command: ["uvicorn", "apps.human_review_api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8100:8001"  # host 8100 -- the entire 8000-8021 range is already bound by unrelated containers on this host
    environment:
      CORRECTION_MEMORY_PATH: /data/feedback/corrections.jsonl
    volumes:
      - ./evaluation_results/feedback:/data/feedback
      - ./evaluation_results:/evaluation_results:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  human-review-task-worker:
    build: *app-build
    <<: *app-env
    command: ["python", "-m", "apps.human_review_api.consumer"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  retry-worker:
    build:
      context: .
      dockerfile: deploy/docker/ppocr-v5.Dockerfile
    <<: *app-env
    command: ["python", "-m", "workers.retry.consumer"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy

  validation-worker:
    build: *app-build
    <<: *app-env
    command: ["python", "-m", "workers.validation.consumer"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  output-generation-worker:
    build: *app-build
    <<: *app-env
    command: ["python", "-m", "workers.output_generation.consumer"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  output-api:
    build: *app-build
    <<: *app-env
    command: ["uvicorn", "apps.output_api.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8102:8002"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  transformation-ui:
    build: *app-build
    <<: *app-env
    command: ["uvicorn", "apps.transformation_ui.main:app", "--host", "0.0.0.0", "--port", "8185"]
    ports:
      - "8185:8185"

  evaluation-ui:
    build:
      context: .
      dockerfile: deploy/docker/evaluation-ui.Dockerfile
    ports:
      - "8180:80"
    volumes:
      - ./evaluation_results:/usr/share/nginx/html/reports:ro
    depends_on:
      ingestion-api:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: deploy/docker/api-gateway.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      ingestion-api:
        condition: service_healthy
      human-review-api:
        condition: service_healthy
      output-api:
        condition: service_healthy

  handwriting-ocr:
    profiles: ["ml"]
    build: *handwriting-build
    <<: *app-env
    volumes:
      - huggingface_models:/models/huggingface
      - ./evaluation_results:/app/evaluation_results:rw

  ppocr-v5:
    profiles: ["ppocr-v5"]
    build:
      context: .
      dockerfile: deploy/docker/ppocr-v5.Dockerfile
    volumes:
      - paddle_models:/root/.paddlex

  ocr-shadow-ppocr-next:
    profiles: ["ocr-shadow"]
    build:
      context: .
      dockerfile: deploy/docker/ocr-shadow-ppocr-next.Dockerfile
    volumes:
      - ./evaluation_results/ocr_shadow_bakeoff:/work:rw
      - ./evaluation_results/table_crop_quality_pilot:/pilot:rw
      - paddle_models:/root/.paddlex
    command:
      - --artifacts
      - /work/normalized_crops/artifacts.json
      - --output
      - /work/inference

  table-shadow:
    profiles: ["table-shadow"]
    build:
      context: .
      dockerfile: deploy/docker/table-shadow.Dockerfile
    volumes:
      - ./evaluation_results:/app/evaluation_results:rw
      - ./evaluation_data:/app/evaluation_data:ro

volumes:
  trusted_claims_mysql_data:
  postgres_data:
  minio_data:
  redpanda_data:
  ocr_audit_data:
  huggingface_models:
  paddle_models:
  paddleocr_runtime_models:
